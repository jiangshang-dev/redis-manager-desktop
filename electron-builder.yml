appId: com.redis.manager.desktop
productName: Redis Manager
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.*'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!**/.idea/*'
extraResources:
  - from: resources/
    to: resources/
    filter:
      - '**/*'
mac:
  icon: icon.png
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
win:
  icon: icon.ico
  target:
    - nsis
linux:
  icon: icon.png
  target:
    - AppImage
nsis:
  installerIcon: icon.ico
  uninstallerIcon: icon.ico
  shortcutName: Redis Manager
